<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voca Battle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="app">
        <!--시작 화면-->
        <section id="start-screen" class="screen">
            <h1>Voca Battle</h1>
            <p class="subtitle">영단어 퀴즈 게임</p>
            <div class="difficulty-container">
                <h2>난이도 선택</h2>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn" data-difficulty="초급">
                        초급
                    </button>
                    <button class="difficulty-btn" data-difficulty="중급">
                        중급
                    </button>
                    <button class="difficulty-btn" data-difficulty="고급">
                        고급
                    </button>
                </div>
            </div>
            <div class="start-buttons">
                <button id="start-btn" class="main-btn">
                    게임 시작
                </button>
                <button id="ranking-btn" class="sub-btn">
                    랭킹 보기
                </button>
            </div>
        </section>

        <!-- 게임 화면 -->
        <section id="game-screen" class="screen hidden">
            <!-- 상단 정보 -->
            <div class="game-header">
                <div class="game-title">VOCABATTLE</div>
                <div class="game-info">
                    <div>
                        SCORE
                        <span id="score">0</span>
                    </div>
                    <div>
                        TIME
                        <span id="timer">10.0</span>
                    </div>
                </div>
            </div>
            <!-- 현재 문제 -->
            <div class="question-area">
                <div class="question-label">CURRENT QUESTION</div>
                <div id="question-word" class="question-word">
                </div>
            </div>
            <!-- 낙하 영역 -->
            <div id="falling-area" class="falling-area">
                <div class="falling-lane">
                    <button class="answer-btn"></button>
                </div>
                <div class="falling-lane">
                    <button class="answer-btn"></button>
                </div>
                <div class="falling-lane">
                    <button class="answer-btn"></button>
                </div>
                <div class="falling-lane">
                    <button class="answer-btn"></button>
                </div>
            </div>

            <!-- 결과 화면 -->
            <section id="result-screen" class="screen hidden">
                <h2>GAME OVER</h2>
                <div class="result-info">
                    <p>
                        최종 점수:
                        <strong id="final-score">0</strong>
                    </p>
                    <p>
                        획득 재화:
                        <strong id="earned-currency">0</strong>
                    </p>
                </div>
                <div class="result-buttons">
                    <button id="restart-btn" class="main-btn">
                        다시 하기
                    </button>
                    <button id="home-btn" class="sub-btn">
                        메인으로
                    </button>
                </div>
            </section>


            <!-- 랭킹 화면 -->
            <section id="ranking-screen" class="screen hidden">
                <h2>RANKING</h2>
                <ol id="ranking-list">
                    <!-- ranking.js에서 생성 -->
                </ol>
                <button id="ranking-home-btn" class="sub-btn">
                    메인으로
                </button>
            </section>
    </main>
    <!-- JavaScript -->
    <script type="module" src="js/main.js"></script>

</body>

</html>
